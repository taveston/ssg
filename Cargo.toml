[package]
name = "orphan_worlds"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.20.0"

# Bevy's default debug build is very slow at runtime; these overrides keep
# iteration fast without giving up debug builds for our own code.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
